spring.application.name=be
server.port=8080

# ── Database (H2 in-memory for dev) ─────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:contractexposed
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# ── File upload limits ───────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# ── Storage directory ────────────────────────────────────────
app.upload.dir=uploads

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:80

# ── Gemini API ───────────────────────────────────────────────
# Lấy API key miễn phí tại: https://aistudio.google.com/apikey
app.gemini.api-key=${GEMINI_API_KEY:your-gemini-api-key-here}
# gemini-flash-latest tự động trỏ vào Flash stable mới nhất — không bị deprecate
app.gemini.model=gemini-3.5-flash
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

